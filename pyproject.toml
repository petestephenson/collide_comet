[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "collide_comet"
version = "0.1.0"
description = "Read and plot outputs of the collisional test-particle model of cometary electrons"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "netCDF4>=1.5",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel"]
dev = ["pytest", "nbclient", "nbformat", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collide_comet = ["data/*.nc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
